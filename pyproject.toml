[project]
name = "analysis-company"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "openai>=3.31.0",
    "pydantic-settings>=2.16.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.4",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pypdf>=6.20.1",
]

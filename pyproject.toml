[project]
name = "analysis-company"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "openai>=3.31.0",
    "pydantic-settings>=2.16.0",
    "pymysql>=1.2.3",
    "pypdf==6.20.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.4",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 只把 app/ 计入覆盖率；迁移脚本与种子数据是一次性产物，纳入会虚高覆盖率
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "db: 需要真实 MySQL 的测试（容器 bilingual-agents-mysql，端口 3308）",
    "slow: 耗时较长的测试，如解析真实年报（`-m \"not slow\"` 跳过）",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/seed/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
